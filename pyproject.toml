[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-desktop-assistant"
version = "0.2.0"
description = "A lightweight, local-first Windows voice controller for Spotify"
requires-python = ">=3.10"
dependencies = [
    "sounddevice>=0.5.6",
    "vosk>=0.3.45",
    "faster-whisper>=1.2.1",
    "pywebrtc-audio>=0.2.0",
    "soundcard>=0.4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["echo*"]
