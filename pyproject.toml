[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-desktop-assistant"
version = "0.1.0"
description = "A lightweight, local-first Windows voice controller for Spotify"
requires-python = ">=3.10"
dependencies = [
    "pvporcupine>=4.0.3",
    "sounddevice>=0.5.6",
    "vosk>=0.3.45",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["echo*"]
